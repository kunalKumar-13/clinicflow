# BROKEN ON PURPOSE - the Service selector does not match the pod labels.
# The Service is created and gets a ClusterIP, but it has zero endpoints, so
# every request fails with no obvious reason in `kubectl get svc`:
#   kubectl get endpoints broken-service -n clinicflow
#   kubectl get pods --show-labels -n clinicflow
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-service-app
  namespace: clinicflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: clinic-api-v2 }
  template:
    metadata:
      labels: { app: clinic-api-v2 }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: broken-service
  namespace: clinicflow
spec:
  selector:
    app: clinic-api          # <-- pods are labelled clinic-api-v2
  ports:
    - port: 80
      targetPort: 80
