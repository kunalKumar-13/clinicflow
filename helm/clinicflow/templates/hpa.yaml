{{- if .Values.hpa.enabled }}
# Scales the backend on CPU. This only works when resource requests are set
# (they are, in values.yaml) and a metrics provider such as Metrics Server is
# installed, otherwise the HPA reports <unknown> for current utilisation.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "clinicflow.fullname" . }}-backend
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "clinicflow.fullname" . }}-backend
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180   # avoid flapping when load drops briefly
{{- end }}
