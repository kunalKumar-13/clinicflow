apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clinicflow.fullname" . }}-backend
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "clinicflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}-backend:{{ .Values.image.backendTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: DATABASE_URL
              value: {{ include "clinicflow.databaseUrl" . | quote }}
            - name: APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: OPENING_HOUR
              value: {{ .Values.backend.env.openingHour | quote }}
            - name: CLOSING_HOUR
              value: {{ .Values.backend.env.closingHour | quote }}
          # Liveness only asks "is the process alive". It deliberately does not
          # touch the database, so a database blip never triggers a pod restart.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          # Readiness does check the database, so a pod that cannot serve is
          # removed from the Service endpoints without being killed.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Gives the migration in the entrypoint time to finish on a cold start.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinicflow.fullname" . }}-backend
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.service.backendPort }}
      targetPort: http
