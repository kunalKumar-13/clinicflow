server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip the static bundle
    gzip on;
    gzip_types text/css application/javascript application/json;

    # The SPA owns client-side routing, so unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api is proxied to the backend Service. BACKEND_URL is substituted at
    # container start by the entrypoint, so the same image works in compose and
    # in Kubernetes.
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
