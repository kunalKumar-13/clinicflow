# ClinicFlow CI/CD
#
#   test  ->  build + scan + push  ->  deploy to a kind cluster
#
# Tests run before anything is built, so a failing test never produces an image.
# Images are tagged with the commit SHA, which makes any running pod traceable
# back to the exact commit it came from.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------ #
  #  1. Quality gate
  # ------------------------------------------------------------------ #
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests

      - name: Run pytest
        working-directory: backend
        run: pytest -v

      - name: Verify the Alembic migration applies
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./migration_check.db
        run: |
          alembic upgrade head
          alembic current

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ------------------------------------------------------------------ #
  #  2. Infrastructure code is valid
  # ------------------------------------------------------------------ #
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"

      - name: Format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Init (no backend, no credentials needed)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate
        working-directory: terraform
        run: terraform validate

      # A real `terraform plan` of the full VPC + EKS stack, without an AWS
      # account. The provider normally calls STS at start-up; creating new
      # resources needs nothing read back from AWS, so with that check skipped
      # and the AZs passed in, the plan runs end to end. The override uses
      # dummy credentials, so nothing could be applied from here even by
      # accident.
      - name: Plan (no AWS account needed)
        working-directory: terraform
        run: |
          cat > ci_override.tf <<'EOF'
          provider "aws" {
            access_key                  = "plan-only-not-a-real-key"
            secret_key                  = "plan-only-not-a-real-secret"
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
          }
          EOF
          terraform plan -input=false -lock=false -refresh=false -no-color \
            -var 'availability_zones=["ap-south-1a","ap-south-1b"]' | tee plan.txt
          echo "::notice title=terraform plan::$(grep '^Plan:' plan.txt)"

      - name: Upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/plan.txt
          retention-days: 30

  # ------------------------------------------------------------------ #
  #  3. Build, scan, push
  # ------------------------------------------------------------------ #
  build:
    name: Build, scan and push images
    runs-on: ubuntu-latest
    needs: [test, terraform]
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      # The owner is lowercased because container registries reject uppercase
      # characters in a repository name, and this account is "kunalKumar-13".
      - name: Work out image names and the commit tag
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "owner_lc=$OWNER_LC"
            echo "sha_tag=${GITHUB_SHA::12}"
            echo "backend_image=${REGISTRY}/${OWNER_LC}/clinicflow-backend"
            echo "frontend_image=${REGISTRY}/${OWNER_LC}/clinicflow-frontend"
          } >> "$GITHUB_OUTPUT"

      - name: Export image names to the job environment
        run: |
          echo "BACKEND_IMAGE=${{ steps.meta.outputs.backend_image }}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${{ steps.meta.outputs.frontend_image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally first so the images can be scanned before they are pushed.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Full report first (never fails) so the log always shows what was found.
      - name: Trivy report - backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          format: table
          exit-code: "0"

      - name: Trivy report - frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          format: table
          exit-code: "0"

      # The gate. ignore-unfixed is deliberate: a CVE with no available patch
      # cannot be acted on, so failing the build on it would only train people
      # to ignore the scanner. Anything fixable at HIGH or CRITICAL stops the
      # pipeline and no image is pushed.
      - name: Trivy gate - backend (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy gate - frontend (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Only now, after tests and the security gate, are images published.
      - name: Push backend image
        if: github.event_name == 'push'
        run: |
          docker tag ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }} ${{ env.BACKEND_IMAGE }}:main
          docker push ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          docker push ${{ env.BACKEND_IMAGE }}:main

      - name: Push frontend image
        if: github.event_name == 'push'
        run: |
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }} ${{ env.FRONTEND_IMAGE }}:main
          docker push ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          docker push ${{ env.FRONTEND_IMAGE }}:main

  # ------------------------------------------------------------------ #
  #  4. Deploy to a real cluster and prove it runs
  # ------------------------------------------------------------------ #
  deploy:
    name: Deploy to kind and verify
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: clinicflow
          config: .github/kind-config.yaml
          wait: 120s

      # kind maps host port 80 onto the control-plane node only, so the
      # controller must run there. The upstream manifest selects on the OS
      # alone, which let the scheduler put it on the worker roughly half the
      # time and every request then got a TCP reset. Label the node and pin
      # the controller to it, and pin the manifest to a release tag rather
      # than a moving branch.
      #
      # `rollout status` is used instead of `wait --for=condition=Available`:
      # with maxUnavailable: 1 on a single replica, Available is true before
      # any pod has started, so that wait returned instantly and checked nothing.
      - name: Install the NGINX ingress controller
        run: |
          kubectl label node clinicflow-control-plane ingress-ready=true --overwrite
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx patch deployment ingress-nginx-controller --type merge \
            -p '{"spec":{"template":{"spec":{"nodeSelector":{"ingress-ready":"true","kubernetes.io/os":"linux"}}}}}'
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=300s
          # The admission-webhook jobs delete themselves once finished, so they
          # may already be gone. Only wait if any are still present.
          if kubectl -n ingress-nginx get jobs -o name 2>/dev/null | grep -q .; then
            kubectl -n ingress-nginx wait --for=condition=complete job --all --timeout=180s
          fi
          kubectl -n ingress-nginx get pods -o wide

      - name: Install Metrics Server (so the HPA has CPU data)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl -n kube-system patch deployment metrics-server --patch-file k8s/metrics-server-kind.yaml
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the images that were just published and side-load them into kind,
      # which avoids needing an imagePullSecret inside the cluster.
      - name: Load the published images into kind
        env:
          TAG: ${{ needs.build.outputs.sha_tag }}
        run: |
          docker pull ${{ env.BACKEND_IMAGE }}:$TAG
          docker pull ${{ env.FRONTEND_IMAGE }}:$TAG
          kind load docker-image ${{ env.BACKEND_IMAGE }}:$TAG --name clinicflow
          kind load docker-image ${{ env.FRONTEND_IMAGE }}:$TAG --name clinicflow

      - name: Create the namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Helm deploy
        env:
          TAG: ${{ needs.build.outputs.sha_tag }}
        run: |
          helm upgrade --install clinicflow ./helm/clinicflow \
            --namespace clinicflow \
            -f helm/clinicflow/values-dev.yaml \
            --set image.repository=${{ needs.build.outputs.owner_lc }}/clinicflow \
            --set image.backendTag=$TAG \
            --set image.frontendTag=$TAG \
            --set image.pullPolicy=IfNotPresent \
            --set hpa.enabled=true \
            --wait --timeout 6m

      - name: Show what is running
        run: |
          echo "::group::pods"
          kubectl get pods -n clinicflow -o wide
          echo "::endgroup::"
          echo "::group::services"
          kubectl get svc -n clinicflow
          echo "::endgroup::"
          echo "::group::ingress"
          kubectl get ingress -n clinicflow
          echo "::endgroup::"
          echo "::group::helm releases"
          helm list -n clinicflow
          echo "::endgroup::"
          echo "::group::deployed image tags"
          kubectl get deploy -n clinicflow -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}'
          echo "::endgroup::"

      # Both replicas run migrations on start. Before the advisory lock in
      # alembic/env.py, one of them could lose the race to create the table and
      # restart. This makes that regression visible instead of silently healed.
      - name: No backend pod restarted (migration race check)
        run: |
          restarts=$(kubectl get pods -n clinicflow -l app.kubernetes.io/component=backend \
            -o jsonpath='{range .items[*]}{.status.containerStatuses[0].restartCount}{"\n"}{end}')
          echo "backend restart counts: $(echo $restarts)"
          total=0; for r in $restarts; do total=$((total + r)); done
          if [ "$total" -gt 0 ]; then
            echo "a backend pod restarted; logs from the container that died:" >&2
            for p in $(kubectl get pods -n clinicflow -l app.kubernetes.io/component=backend -o name); do
              kubectl logs -n clinicflow "$p" --previous --tail=60 2>/dev/null || true
            done
            exit 1
          fi

      - name: Smoke test through the Ingress
        run: |
          # Let the browser-facing name resolve on the runner, exactly as it would
          # for a user who added it to their hosts file.
          echo "127.0.0.1 clinicflow.local" | sudo tee -a /etc/hosts

          echo "waiting for the ingress to start serving..."
          served=no
          for i in $(seq 1 30); do
            if curl -fsS http://clinicflow.local/api/appointments/stats >/dev/null 2>&1; then
              served=yes; echo "ingress serving after $((i * 5))s"; break
            fi
            sleep 5
          done
          # Fail here with a clear message rather than three steps later with a
          # bare curl error, which is what happened the first time round.
          if [ "$served" != yes ]; then
            echo "the ingress never served http://clinicflow.local within 150s" >&2
            kubectl -n ingress-nginx get pods -o wide >&2
            exit 1
          fi

          # /health and /ready are probe endpoints, deliberately not routed
          # through the Ingress, so they are checked from inside the pod.
          echo "::group::GET /health and /ready (inside the backend pod)"
          kubectl exec -n clinicflow deploy/clinicflow-clinicflow-backend -- curl -fsS http://localhost:8000/health
          echo ""
          kubectl exec -n clinicflow deploy/clinicflow-clinicflow-backend -- curl -fsS http://localhost:8000/ready
          echo ""
          echo "::endgroup::"

          echo "::group::seed a day of appointments through the Ingress (includes a clash check)"
          bash scripts/seed.sh http://clinicflow.local
          echo "::endgroup::"

          echo "::group::GET /api/appointments through the Ingress"
          curl -fsS http://clinicflow.local/api/appointments | python3 -m json.tool | head -40
          echo "::endgroup::"

          echo "::group::frontend through the Ingress"
          curl -fsS http://clinicflow.local/ | head -12
          echo "::endgroup::"

      - name: Prometheus metrics are exposed by the backend
        run: |
          kubectl exec -n clinicflow deploy/clinicflow-clinicflow-backend -- \
            curl -fsS http://localhost:8000/metrics | grep -E '^http_requests_total' | head -15

      # ---------------------------------------------------------------- #
      #  Observability: Prometheus scraping the app, Grafana on top
      # ---------------------------------------------------------------- #
      - name: Install Prometheus and Grafana (kube-prometheus-stack)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            -n monitoring --create-namespace \
            -f monitoring/prometheus-values.yaml \
            --wait --timeout 10m
          kubectl get pods -n monitoring

      - name: Turn on the ServiceMonitor for the backend
        run: |
          helm upgrade clinicflow ./helm/clinicflow -n clinicflow \
            --reuse-values --set serviceMonitor.enabled=true --wait --timeout 5m
          kubectl get servicemonitor -n clinicflow

      - name: Generate traffic for the dashboards
        run: |
          # ~90 seconds of mixed reads so rate() has something to show
          end=$(( $(date +%s) + 90 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            curl -s -o /dev/null http://clinicflow.local/api/appointments
            curl -s -o /dev/null http://clinicflow.local/api/appointments/stats
            curl -s -o /dev/null "http://clinicflow.local/api/appointments?status=scheduled"
            curl -s -o /dev/null http://clinicflow.local/api/appointments/999999   # a 404, so errors are visible too
            sleep 0.2
          done
          echo "traffic generated"

      - name: Prometheus is scraping the app and the target is UP
        run: |
          kubectl -n monitoring port-forward svc/monitoring-kube-prometheus-prometheus 9090:9090 >/tmp/pf-prom.log 2>&1 &
          sleep 5

          echo "waiting for the clinicflow target to report up..."
          for i in $(seq 1 30); do
            up=$(curl -s localhost:9090/api/v1/targets | python3 -c "
          import json, sys
          t = json.load(sys.stdin)['data']['activeTargets']
          print(sum(1 for x in t if 'clinicflow' in x['labels'].get('job', '') and x['health'] == 'up'))
          " 2>/dev/null || echo 0)
            [ "${up:-0}" -ge 1 ] && break
            sleep 10
          done

          echo "::group::active scrape targets for the application"
          curl -s localhost:9090/api/v1/targets | python3 -c "
          import json, sys
          for x in json.load(sys.stdin)['data']['activeTargets']:
              if 'clinicflow' in x['labels'].get('job', ''):
                  print(f\"{x['labels']['job']:<34} {x['scrapeUrl']:<44} health={x['health']}  lastScrape={x['lastScrape'][:19]}\")
          "
          echo "::endgroup::"

          echo "::group::PromQL: request rate by endpoint"
          curl -s localhost:9090/api/v1/query --data-urlencode \
            'query=sum by (handler, status) (rate(http_requests_total{job=~".*clinicflow.*"}[1m]))' \
            | python3 -c "
          import json, sys
          for r in json.load(sys.stdin)['data']['result']:
              print(f\"{r['metric'].get('handler',''):<34} {r['metric'].get('status',''):<4} {float(r['value'][1]):.3f} req/s\")
          "
          echo "::endgroup::"

          [ "${up:-0}" -ge 1 ] || { echo "the clinicflow target never came up" >&2; exit 1; }

      - name: Load the ClinicFlow dashboard into Grafana
        run: |
          kubectl -n monitoring port-forward svc/monitoring-grafana 3001:80 >/tmp/pf-grafana.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS localhost:3001/api/health >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS localhost:3001/api/health; echo

          python3 -c "
          import json
          dash = json.load(open('monitoring/grafana-dashboard.json'))
          print(json.dumps({'dashboard': dash, 'overwrite': True, 'folderId': 0}))
          " > /tmp/dashboard-payload.json

          curl -fsS -u admin:clinicflow -H 'Content-Type: application/json' \
            -X POST localhost:3001/api/dashboards/db -d @/tmp/dashboard-payload.json
          echo

      # ---------------------------------------------------------------- #
      #  Evidence: real browser screenshots of the running system
      # ---------------------------------------------------------------- #
      - name: Set up Node for the screenshot run
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture screenshots
        working-directory: scripts
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node capture-screenshots.mjs ../evidence app prometheus grafana

      - name: Record cluster state alongside the screenshots
        if: always()
        run: |
          mkdir -p evidence
          {
            echo "# kubectl get pods -n clinicflow -o wide"; kubectl get pods -n clinicflow -o wide; echo
            echo "# kubectl get svc -n clinicflow";          kubectl get svc -n clinicflow; echo
            echo "# kubectl get ingress -n clinicflow";      kubectl get ingress -n clinicflow; echo
            echo "# kubectl get hpa -n clinicflow";          kubectl get hpa -n clinicflow 2>&1; echo
            echo "# helm list -A";                           helm list -A; echo
            echo "# kubectl get pods -n monitoring";         kubectl get pods -n monitoring; echo
          } > evidence/cluster-state.txt 2>&1
          cat evidence/cluster-state.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-evidence
          path: evidence/
          retention-days: 30

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe pods -n clinicflow || true
          kubectl logs -n clinicflow -l app.kubernetes.io/component=backend --tail=100 || true
          kubectl get events -n clinicflow --sort-by=.lastTimestamp || true
          kubectl get events -n monitoring --sort-by=.lastTimestamp | tail -30 || true

  # ------------------------------------------------------------------ #
  #  5. The whole stack with Docker Compose
  # ------------------------------------------------------------------ #
  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up --build
        run: docker compose up -d --build

      - name: Wait for all three services
        run: |
          for i in $(seq 1 40); do
            curl -fsS localhost:8000/ready >/dev/null 2>&1 && curl -fsS localhost:3000/healthz >/dev/null 2>&1 && break
            sleep 3
          done
          echo "::group::docker compose ps"
          docker compose ps
          echo "::endgroup::"
          echo "::group::backend /health and /ready"
          curl -fsS localhost:8000/health; echo
          curl -fsS localhost:8000/ready; echo
          echo "::endgroup::"
          echo "::group::container users (both must be non-root)"
          echo "backend : $(docker compose exec -T backend id)"
          echo "frontend: $(docker compose exec -T frontend id)"
          echo "::endgroup::"

      - name: Seed through the frontend's /api proxy
        run: bash scripts/seed.sh http://localhost:3000

      - name: Set up Node for the screenshot run
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Screenshot localhost:3000
        working-directory: scripts
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node capture-screenshots.mjs ../evidence compose

      - name: Save compose logs
        if: always()
        run: |
          mkdir -p evidence
          docker compose ps > evidence/compose-ps.txt 2>&1
          docker compose logs --no-color > evidence/compose-logs.txt 2>&1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-evidence
          path: evidence/
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose down -v
