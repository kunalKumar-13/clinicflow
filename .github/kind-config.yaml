# kind cluster used by the deploy job.
#
# extraPortMappings puts the ingress controller on localhost:80 inside the
# runner, so the pipeline can curl the application the same way a browser would.
# The ingress-ready label is what the kind flavour of the ingress-nginx manifest
# schedules its controller onto.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: clinicflow
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
